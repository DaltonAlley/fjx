name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test utilities
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes git util-linux

      - name: Install just
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@1.51.0

      - name: Install repository Rust toolchain
        # rustup reads the channel, profile and components from rust-toolchain.toml.
        run: |
          rustup toolchain install
          cargo --version
          rustc --version

      - name: Build and run local CLI tests
        run: just check

  windows:
    name: Native Windows token storage
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check Windows code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Windows tests
        run: cargo test --locked --all-targets
