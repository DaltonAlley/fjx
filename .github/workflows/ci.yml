name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust and Nushell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test utilities
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes git util-linux zip unzip file

      - name: Install pinned Nushell
        # Digest from nushell/nushell's 0.112.2 release assets. Review both on update.
        env:
          NU_VERSION: 0.112.2
          NU_SHA256: d9c0ba0938beed6148c8a354c45612c0979d7a787794b8dd13e866ca3b571375
        run: |
          archive="nu-${NU_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${archive}.tar.gz" \
            --output "${RUNNER_TEMP}/nu.tar.gz"
          echo "${NU_SHA256}  ${RUNNER_TEMP}/nu.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/fjx-nu"
          tar -xzf "${RUNNER_TEMP}/nu.tar.gz" -C "${RUNNER_TEMP}/fjx-nu" \
            --strip-components=1 "${archive}/nu"
          test "$("${RUNNER_TEMP}/fjx-nu/nu" --version)" = "${NU_VERSION}"
          echo "${RUNNER_TEMP}/fjx-nu" >> "$GITHUB_PATH"

      - name: Install repository Rust toolchain
        run: |
          toolchain="$(nu --no-config-file -c 'open rust-toolchain.toml | get toolchain.channel')"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
          cargo --version
          rustc --version

      - name: Run all checks
        run: nu --no-config-file scripts/check.nu
