[package]
name = "fjx"
version = "0.2.0"
edition = "2024"
publish = false
description = "A small, stable Forgejo command-line client"
license = "MIT"
repository = "https://github.com/DaltonAlley/fjx"
readme = "README.md"
keywords = ["forgejo", "cli", "git", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
lexopt = "=0.3.2"
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.142"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
